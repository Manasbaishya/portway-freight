<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portway Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, operational, like a well-run dispatch desk.
   IDEA: a shipping label and a freight manifest — bold labels, ruled rows.
   PICTURE: the working console itself: PO manifest table first.
   COLOUR and TYPE: container blue, safety orange accent, white/charcoal; Archivo, large for readability.
   LAYOUT: header strip, quick-fetch bar, tabs, content; one column on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f9,#0b0f17);--card:light-dark(#ffffff,#151b26);--ink:light-dark(#111827,#e5e9f0);--mute:light-dark(#5b6476,#a6afbf);
--line:light-dark(#e3e7ee,#283041);--blue:light-dark(#2563eb,#6b9bff);--blueInk:light-dark(#ffffff,#0b0f17);--blueSoft:light-dark(#eef3ff,#1a2540);--orange:#d97706;--orangeInk:light-dark(#b45309,#f5b041);
--green:light-dark(#15803d,#4ade80);--red:light-dark(#dc2626,#f87171);
--rail:#0f172a;--railInk:#e2e8f0;--railMute:#94a3b8;--railLine:#1e293b;--railActive:#2563eb;
--display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:18px}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(3vw,14px)}
.who{display:flex;gap:8px;align-items:center;font-size:15px}
.who select{background:#fff;color:#121620;border:0;border-radius:6px;padding:9px 10px;min-height:44px;max-width:340px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 16px;min-height:44px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--blueInk);border-color:var(--blue)}
.btn.accent{background:var(--orange);color:#17120e;border-color:var(--orange)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:5px 12px;font-size:15px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.quick{background:var(--card);border-bottom:1px solid var(--line)}
.quick .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding-block:16px}
.quick form{display:flex;gap:10px;align-items:end;flex:1 1 420px;flex-wrap:wrap}
.quick label{flex:1 1 260px}
.bulk{display:flex;gap:10px;flex-wrap:wrap}
.cnt{display:inline-block;background:var(--blueSoft);color:var(--blue);border-radius:99px;padding:0 9px;margin-left:6px;font-size:14px}
label{display:block;font-size:15px;font-weight:600;color:var(--mute)}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{display:inline-block;width:20px;height:20px;min-height:0;margin:0 8px 0 0;vertical-align:middle}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--railInk);padding:16px 10px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rbrand{display:flex;gap:10px;align-items:center;padding:0 6px}
.rbrand strong{font-size:17px;font-weight:600;line-height:1.2;display:block;color:#fff}
.rbrand small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#60a5fa;display:block}
.side{display:flex;flex-direction:column;gap:3px}
.side h4{margin:14px 12px 6px;font-size:12px;color:var(--railMute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side h4:first-child{margin-top:0}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;min-height:46px;border-radius:8px;cursor:pointer;font-weight:500;font-size:16px;color:var(--railInk)}
.side button:hover{background:var(--railLine)}
.side button.on{background:var(--railActive);color:#fff;font-weight:600}
.side button .c{font-size:13px;font-weight:600;background:#334155;color:#e2e8f0;border-radius:99px;padding:1px 9px}
.side button.on .c{background:rgba(255,255,255,.22);color:#fff}
.side button .c.hot{background:#7f1d1d;color:#fecaca}
.railnote{margin-top:auto;font-size:14px;color:var(--railMute);padding:12px;border:1px solid var(--railLine);border-radius:6px}
.railnote b{color:var(--railInk)}
.mainw{min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px max(2.5vw,14px);background:var(--card);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:700}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 9px;margin-left:10px;vertical-align:middle;font-weight:500}
.ptitle{margin:24px 0 4px}.ptitle h2{font-size:24px}.ptitle p{color:var(--mute);margin:4px 0 0}
.topbar .who{color:var(--mute);white-space:nowrap}
.topbar .who select{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.content{padding:0 max(2.5vw,14px)}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:static;height:auto;padding:12px;gap:10px}.side{flex-direction:row;overflow-x:auto}.side h4,.railnote{display:none}.side button{flex:none;width:auto;border-left:0;border-bottom:4px solid transparent}.side button.on{border-bottom-color:transparent}}
.content .quickcard{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.content .quickcard form{display:flex;gap:10px;align-items:end;flex:1 1 380px;flex-wrap:wrap}
.content .quickcard label{flex:1 1 240px}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}.side{border-right:0;border-bottom:1px solid var(--line);padding:10px}.side nav{position:static;flex-direction:row;overflow-x:auto}.side h4{display:none}.side button{flex:none;width:auto}}
main{padding-bottom:60px}
.sec{margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px}
.kpi span{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.kpi b{display:block;margin-top:10px;font-size:30px;font-weight:700;line-height:1.1;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:18px 0 12px}
.bar label{flex:1 1 240px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--card)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blueSoft)}
.tbl{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-size:14px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--card)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-po_issued{color:light-dark(#b45309,#f5b041);border-color:light-dark(#fcd9a8,#5c4213);background:light-dark(#fffaf0,#2a2110)}
.s-docs_submitted{color:light-dark(#5b4fd6,#a9a1ff);border-color:light-dark(#d4cffc,#3b3570);background:light-dark(#f6f5ff,#1e1b38)}
.s-rfq_open{color:light-dark(#2563eb,#6b9bff);border-color:light-dark(#bcd0fb,#24407a);background:light-dark(#f2f6ff,#152240)}
.s-ff_awarded{color:light-dark(#4338ca,#8f9bff);border-color:light-dark(#c7cbf7,#30366e);background:light-dark(#f4f5ff,#1a1d3a)}
.s-in_transit{color:light-dark(#0369a1,#5cc4f2);border-color:light-dark(#b6dff4,#1d4560);background:light-dark(#f0f9ff,#10273a)}
.s-delivered{color:light-dark(#15803d,#4ade80);border-color:light-dark(#b7e4c5,#1d4a2e);background:light-dark(#f0fdf4,#0f2a1a)}
.mono{font-family:var(--mono);font-size:15px}
.small{font-size:15px;color:var(--mute)}
.muted{color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.q{border:2px solid var(--line);border-radius:6px;padding:14px;background:var(--card)}
.q.best{border-color:var(--green)}.q.fast{border-color:var(--blue)}
.q .tot{font-size:30px;font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;margin:0 6px 6px 0}
.tag.low{background:var(--green);color:#fff}.tag.fast{background:var(--blue);color:var(--blueInk)}.tag.won{background:var(--orange);color:#17120e}.tag.lost{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.note{border-left:5px solid var(--orange);background:light-dark(#fff6ef,#2a1d14);padding:12px 14px;border-radius:0 10px 10px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:20}
.modal{background:var(--card);border-radius:8px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h2{margin-right:auto}
.mbody{padding:18px 20px 24px}
.mtabs{display:flex;overflow-x:auto;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}
.mtabs button{flex:none;border:0;background:none;padding:12px 12px;min-height:46px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.mtabs button.on{color:var(--blue);border-color:var(--blue)}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.kv div{border-bottom:1px dashed var(--line);padding-bottom:6px}
dt{font-size:14px;color:var(--mute);font-weight:600}dd{margin:2px 0 0;font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.lbh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.calc{background:var(--blueSoft);border-radius:6px;padding:10px 12px;font-weight:700;margin-top:5px;min-height:44px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.seg label{margin:0;padding:10px 16px;cursor:pointer;color:var(--ink);display:flex;align-items:center}
.seg label:has(input:checked){background:var(--blue);color:#fff}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.docrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.docrow .nm{flex:1 1 220px}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 18px 28px;border-left:3px solid var(--line);margin-left:8px}
.timeline li:last-child{border-color:transparent}
.timeline li::before{content:"";position:absolute;left:-10px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.timeline li.done::before{background:var(--green)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.rbox span{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rbox b{display:block;font-size:20px;margin-top:4px;white-space:nowrap}
.rbox em{display:block;font-style:normal;font-size:14px;color:var(--mute)}
.doclist{display:flex;flex-wrap:wrap;gap:8px}
.dchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:15px}
.dchip.have{border-color:light-dark(#b7e4c5,#1d4a2e);background:light-dark(#f0fdf4,#0f2a1a)}
.dchip.miss{border-color:light-dark(#f5c2c2,#5a1f1f);background:light-dark(#fef2f2,#2a1212);color:var(--red)}
.ffpick{border-top:1px solid var(--line);padding-top:14px}
.ffopt{display:flex;gap:4px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);cursor:pointer;font-weight:400}
.ffopt:has(input:checked){border-color:var(--blue);background:var(--blueSoft)}
.ffopt.locked{opacity:.75;cursor:default}
.ffopt input{margin-top:3px}
.fetchcard{display:flex;flex-direction:column;gap:12px}
.fetchcard .filters .btn{align-self:end}
.sp-new{color:light-dark(#475569,#cbd5e1);border-color:light-dark(#cbd5e1,#334155);background:light-dark(#f8fafc,#1e2533)}
.sp-po_issued{color:light-dark(#b45309,#f5b041);border-color:light-dark(#fcd9a8,#5c4213);background:light-dark(#fffaf0,#2a2110)}
.sp-docs_submitted{color:light-dark(#5b4fd6,#a9a1ff);border-color:light-dark(#d4cffc,#3b3570);background:light-dark(#f6f5ff,#1e1b38)}
.sp-nfa{color:light-dark(#7c2d92,#e19bf5);border-color:light-dark(#e9c6f3,#4f2a5c);background:light-dark(#fcf5ff,#24152b)}
.sp-rfq_open{color:light-dark(#2563eb,#6b9bff);border-color:light-dark(#bcd0fb,#24407a);background:light-dark(#f2f6ff,#152240)}
.sp-ff_awarded,.sp-in_transit{color:light-dark(#0369a1,#5cc4f2);border-color:light-dark(#b6dff4,#1d4560);background:light-dark(#f0f9ff,#10273a)}
.sp-delivered{color:light-dark(#15803d,#4ade80);border-color:light-dark(#b7e4c5,#1d4a2e);background:light-dark(#f0fdf4,#0f2a1a)}
.mprev{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);font-size:15px;max-height:420px;overflow:auto;margin-top:5px}

table.rt td.pgc{min-width:140px}table.rt td.dst{min-width:200px}
.fetchcard .filters label{flex:1 1 150px}.fetchcard .filters label.grow{flex:1.5 1 200px}.fetchcard .filters .btn{flex:none}
table.qt tr.won td{background:light-dark(#f0fdf4,#0f2a1a)}table.qt tr.lost td{opacity:.65}
.qbar{height:6px;background:var(--bg);border-radius:3px;margin-top:6px;min-width:90px}.qbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.pksum{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.pklist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.pk{display:grid;grid-template-columns:auto minmax(0,1.6fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink);font-weight:400;cursor:pointer}
.pk.on{border-color:var(--blue);background:var(--blueSoft)}
.pk.locked{opacity:.7;cursor:default}
.pk input{margin:0}
@media(max-width:600px){.pk{grid-template-columns:auto minmax(0,1fr)}.pkr{grid-column:2}}
.kpi em{display:block;font-style:normal;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.brow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center}
.bl{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}

.brow:hover .bt i{filter:brightness(1.15)}
.mchart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;height:240px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:12px}
.mcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}

.views{display:flex;gap:10px;flex-wrap:wrap}

function refreshResp(){const t=$('#respTable');if(t)t.innerHTML=respTable();const f=$('#ffBar');if(f)f.innerHTML=ffBar()}
function refreshPick(){const g=$('#pickGo');if(g){g.disabled=!ui.pick.length;g.textContent=`Send RFQ to ${ui.pick.length} forwarder${ui.pick.length===1?'':'s'}`}document.querySelectorAll('[data-pick]').forEach(x=>x.closest('.pk').classList.toggle('on',x.checked&&!x.disabled))}
function rfqSend(p,pick){
 if(p.status==='docs_submitted'){dispatchRfq(p,pick);notify('logistics','RFQ dispatched',`PO ${p.poNumber} sent to ${pick.length} forwarder(s).`,p.id);return pick.length}
 if(p.status==='rfq_open'){const add=pick.filter(e=>!p.invitedForwarderEmails.map(low).includes(e));if(!add.length)return 0;p.invitedForwarderEmails.push(...add);touch(p);
  add.forEach(e=>notify(e,'New RFQ open',`PO ${p.poNumber} — ${p.packing.units} ${p.packing.mode}, ${p.packing.grossKg} kg, ${p.packing.cbm} CBM ${p.originPort} → ${p.destinationPort}. Please quote.`,p.id));return add.length}
 return 0}

function nfaText(p){const w=p.quotes.find(q=>q.id===p.nfa.quoteId);if(!w)return'';const qs=[...p.quotes].sort((a,b)=>a.totalUsd-b.totalUsd),k=p.packing,ch=k?Math.max(Math.round(k.cbm*167),Math.round(num(k.grossKg))):0;
 const rank=qs.findIndex(q=>q.id===w.id)+1,hi=qs[qs.length-1].totalUsd,avg=qs.reduce((a,q)=>a+q.totalUsd,0)/qs.length;
 return `NOTE FOR APPROVAL – FREIGHT AWARD
PO ${p.poNumber} · ${p.description}
Supplier: ${p.supplierName} · ${p.originPort} → ${p.destinationPort} · ${p.incoterms}
Cargo: ${k?`${k.units} ${k.mode}, ${k.grossKg} kg gross, ${k.cbm} CBM, ${ch} kg chargeable, pickup ${fdate(k.pickupReadyDate)}`:'—'}

Quotes received: ${qs.length} of ${p.invitedForwarderEmails.length} invited
${qs.map((q,i)=>`L${i+1}  ${q.ffCompany} – ${usd(q.totalUsd)} · ${q.transitDays} days · ${q.carrier} (${q.route})`).join('\n')}

Recommended: ${w.ffCompany} (L${rank}) – ${usd(w.totalUsd)} (${usd(w.baseUsd)} base + ${usd(w.surchargeUsd)} surcharges), ${w.transitDays} days, ${w.carrier}
Saving vs highest quote: ${usd(hi-w.totalUsd)} · vs average: ${usd(Math.max(0,avg-w.totalUsd))}

Justification: ${p.nfa.justification}`}
function nfaCard(p){const w=p.quotes.find(q=>q.id===p.nfa.quoteId);if(!w)return'';const qs=[...p.quotes].sort((a,b)=>a.totalUsd-b.totalUsd),rank=qs.findIndex(q=>q.id===w.id)+1,hi=qs[qs.length-1].totalUsd,k=p.packing;
 const approved=p.nfa.status==='approved';
 return `<div class="card sec nfa"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3><a href="#" class="polink mono" data-act="open" data-id="${esc(p.id)}">${esc(p.poNumber)}</a> · ${esc(p.description)}</h3><div class="small">${esc(p.supplierName)} · ${esc(p.originPort)} → ${esc(p.destinationPort)}${k?` · ${esc(k.grossKg)} kg · ${esc(k.cbm)} CBM`:''} · selected ${fdt(p.nfa.selectedAt)}</div></div><span class="pill ${approved?'s-delivered':'s-po_issued'}">${approved?'NFA approved':'NFA pending approval'}</span></div>
 <div class="rgrid sec"><div class="rbox"><span>Recommended forwarder</span><b>${esc(w.ffCompany)}</b><em>L${rank} of ${qs.length} · ${esc(w.carrier)}</em></div>
 <div class="rbox"><span>Freight cost</span><b>${usd(w.totalUsd)}</b><em>${usd(w.baseUsd)} base + ${usd(w.surchargeUsd)}</em></div>
 <div class="rbox"><span>Transit</span><b>${esc(w.transitDays)} days</b><em>${esc(w.route)}</em></div>
 <div class="rbox"><span>Saving vs highest</span><b>${usd(hi-w.totalUsd)}</b><em>${qs.length} quotes compared</em></div></div>
 <form data-form="nfaSave" data-id="${esc(p.id)}" class="sec"><label>Justification for NFA<textarea name="j" maxlength="600" style="min-height:70px">${esc(p.nfa.justification)}</textarea></label>
 <div class="row sec">${approved?`<button type="button" class="btn primary" data-act="award" data-id="${esc(p.id)}" data-q="${esc(w.id)}">Ask for PO (Ariba)</button>`:`<button type="button" class="btn primary" data-act="nfaApprove" data-id="${esc(p.id)}">Mark NFA approved</button>`}
 <button class="btn">Save justification</button><button type="button" class="btn" data-act="nfaCopy" data-id="${esc(p.id)}">Copy NFA note</button><button type="button" class="btn" data-act="nfaBack" data-id="${esc(p.id)}">Change selection</button></div></form>
 <details class="sec"><summary><b>All ${qs.length} quotes</b></summary><div class="sec">${quoteTable(p,false)}</div></details></div>`}
const DAYMS=864e5,dd=(a,b)=>a&&b?(new Date(b)-new Date(a))/DAYMS:null,avgOf=a=>{const v=a.filter(x=>x!=null&&isFinite(x)&&x>=0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const f1=v=>v==null?'—':v.toFixed(1),pct=(a,b)=>b?Math.round(a/b*100)+'%':'—',kg=p=>p.packing?Math.max(Math.round(p.packing.cbm*167),Math.round(num(p.packing.grossKg))):0;
const winQ=p=>p.quotes.find(q=>q.status==='awarded'),awardAt=p=>p.awardedAt||(winQ(p)?.at)||null,AWD=['ff_awarded','in_transit','delivered'];
const pickedUp=p=>p.tracking.find(t=>t.milestone==='picked_up')?.at||(p.shipment&&!['','awaiting_pickup'].includes(p.shipment.milestone)?p.shipment.pickupTime:null);
const countryOf=p=>p.packing?.coo||cooOf(p.originPort)||'Unknown',regionOf=p=>REGION[countryOf(p)]||'Other';
function xPos(){const f=ui.xf;return db.pos.filter(p=>(f.grp==='All'||p.purchaseGroup===f.grp)&&(!f.dest||p.plant===f.dest)&&(!f.reg||regionOf(p)===f.reg))}
function hbars(L,fmt,sub){const mx=Math.max(1,...L.map(x=>x.v));return L.length?`<div class="bars">${L.map(x=>`<div class="brow" title="${esc(x.k)}: ${fmt(x.v)}${x.s?' · '+esc(x.s):''}"><span class="bl">${esc(x.k)}</span><span class="bt"><i style="width:${Math.max(2,x.v/mx*100)}%"></i></span><span class="bv"><b>${fmt(x.v)}</b>${x.s?`<em>${esc(x.s)}</em>`:''}</span></div>`).join('')}</div>`:'<p class="muted">No data yet.</p>'}
function execData(){
 const P=xPos(),A=P.filter(p=>AWD.includes(p.status)&&winQ(p));
 const spend=A.reduce((a,p)=>a+winQ(p).totalUsd,0),chg=A.reduce((a,p)=>a+kg(p),0);
 const hi=A.reduce((a,p)=>a+Math.max(...p.quotes.map(q=>q.totalUsd)),0),save=hi-spend;
 const goods=A.reduce((a,p)=>a+p.items.reduce((s,i)=>s+num(i.qty)*priceOf(i.material),0),0);
 const D=P.filter(p=>p.status==='delivered'&&p.shipment?.actualDelivery),onT=D.filter(p=>new Date(p.shipment.actualDelivery)<=new Date(p.shipment.eta));
 const late=P.filter(p=>['ff_awarded','in_transit'].includes(p.status)&&p.shipment?.eta&&new Date(p.shipment.eta)<new Date());
 const cyc={resp:avgOf(P.map(p=>p.packing?dd(p.createdAt,p.packing.submittedAt):null)),award:avgOf(A.map(p=>dd(p.packing?.submittedAt,awardAt(p)))),pick:avgOf(A.map(p=>dd(awardAt(p),pickedUp(p)))),transit:avgOf(D.map(p=>dd(pickedUp(p),p.shipment.actualDelivery))),e2e:avgOf(D.map(p=>dd(p.createdAt,p.shipment.actualDelivery)))};
 return{P,A,D,onT,late,spend,chg,save,hi,goods,cyc}}
function execSummary(){const x=execData();return `Freight control tower – exec summary (${fdate(day(0))})
• Freight awarded: ${usd(x.spend)} on ${x.A.length} shipments · ${x.chg?'$'+(x.spend/x.chg).toFixed(2):'—'}/kg chargeable
• Savings vs highest quote: ${usd(x.save)} (${x.hi?(x.save/x.hi*100).toFixed(1):0}%)
• On-time delivery: ${pct(x.onT.length,x.D.length)} of ${x.D.length} delivered · ${x.late.length} in-flight past ETA
• Cost per chargeable kg by origin: ${['APAC','EMEA','North America'].map(r=>{const L=x.A.filter(p=>regionOf(p)===r),sp=L.reduce((s,p)=>s+winQ(p).totalUsd,0),k=L.reduce((s,p)=>s+kg(p),0);return `${r} ${k?'$'+(sp/k).toFixed(2):'—'}`}).join(' · ')}
• Cycle time: supplier reply ${f1(x.cyc.resp)} d · RFQ to award ${f1(x.cyc.award)} d · transit ${f1(x.cyc.transit)} d · PO request to delivery ${f1(x.cyc.e2e)} d
• Open: ${x.P.filter(p=>p.status==='po_issued').length} awaiting supplier (${x.P.filter(p=>p.status==='po_issued'&&ageDays(p.createdAt)>=5).length} overdue 5+ days) · ${x.P.filter(p=>p.status==='rfq_open').length} RFQs open · ${x.P.filter(p=>p.status==='in_transit').length} in transit`}
function tabExec(){
 const f=ui.xf,x=execData(),P=x.P,A=x.A,all=feedRows();
 const dests=[...new Set(db.pos.map(p=>p.plant).filter(Boolean))].sort();

 P.filter(p=>p.status==='rfq_open'&&p.nfa&&p.nfa.status!=='approved').forEach(p=>att.push(['info',`PO ${p.poNumber}: NFA waiting for approval`,p.id]));
 P.filter(p=>p.status==='docs_submitted'&&isReady(p)).length&&att.push(['info',`${P.filter(p=>p.status==='docs_submitted'&&isReady(p)).length} supplier responses ready for RFQ`,'']);
 // weekly spend
 const wk=d=>{const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7));return t};
 const W=[];const w0=wk(new Date());for(let i=7;i>=0;i--){const a=new Date(w0);a.setDate(a.getDate()-7*i);W.push(a)}
 const wks=W.map(a=>{const b=new Date(a);b.setDate(b.getDate()+7);const L=A.filter(p=>{const t=new Date(awardAt(p));return t>=a&&t<b});return{a,v:L.reduce((s,p)=>s+winQ(p).totalUsd,0),n:L.length}}),wmx=Math.max(1,...wks.map(w=>w.v));
 // supplier scorecard
 const supRows=[...new Set(P.map(p=>low(p.supplierEmail)))].map(e=>{const L=P.filter(p=>low(p.supplierEmail)===e),R=L.filter(p=>p.packing),Aw=L.filter(p=>AWD.includes(p.status)&&winQ(p));
  return{name:L[0].supplierName,country:countryOf(L[0]),reg:regionOf(L[0]),n:L.length,wait:L.filter(p=>p.status==='po_issued').length,over:L.filter(p=>p.status==='po_issued'&&ageDays(p.createdAt)>=5).length,resp:avgOf(R.map(p=>dd(p.createdAt,p.packing.submittedAt))),docs:R.length?R.filter(p=>!missingDocs(p).length).length/R.length:null,spend:Aw.reduce((s,p)=>s+winQ(p).totalUsd,0),kgs:Aw.reduce((s,p)=>s+kg(p),0),goods:L.reduce((s,p)=>s+p.items.reduce((t,i)=>t+num(i.qty)*priceOf(i.material),0),0)}}).sort((a,b)=>b.spend-a.spend);
 // forwarder scorecard
 const ffRows=ffs().map(f=>{const e=low(f.email),Inv=P.filter(p=>p.invitedForwarderEmails.map(low).includes(e)&&!['po_issued','docs_submitted'].includes(p.status)),Q=P.filter(p=>p.quotes.some(q=>low(q.ffEmail)===e)),Wn=P.filter(p=>low(p.awardedForwarderEmail)===e&&winQ(p)),Dl=Wn.filter(p=>p.status==='delivered'&&p.shipment?.actualDelivery);
  return{name:f.companyName,inv:Inv.length,q:Q.length,won:Wn.length,closed:Q.filter(p=>AWD.includes(p.status)).length,spend:Wn.reduce((s,p)=>s+winQ(p).totalUsd,0),kgs:Wn.reduce((s,p)=>s+kg(p),0),transit:avgOf(Wn.map(p=>winQ(p).transitDays)),ontime:Dl.length?Dl.filter(p=>new Date(p.shipment.actualDelivery)<=new Date(p.shipment.eta)).length/Dl.length:null,dl:Dl.length}}).sort((a,b)=>b.spend-a.spend||b.q-a.q);
 const byKey=(fn,lbl)=>{const m=new Map();A.forEach(p=>{const k=fn(p);const o=m.get(k)||{k,v:0,n:0,kg:0};o.v+=winQ(p).totalUsd;o.n++;o.kg+=kg(p);m.set(k,o)});return [...m.values()].sort((a,b)=>b.v-a.v).map(o=>({k:o.k,v:o.v,s:`${o.n} shipment(s) · $${(o.v/Math.max(1,o.kg)).toFixed(2)}/kg`}))};
 const cyc=[['Supplier reply','PO request → packing & docs',x.cyc.resp],['RFQ to award','Docs → forwarder awarded',x.cyc.award],['Award to pickup','Ariba PO → cargo picked up',x.cyc.pick],['Transit','Pickup → delivered at plant',x.cyc.transit]];
 const cmx=Math.max(1,...cyc.map(c=>c[2]||0));
 const pc=v=>v==null?'—':Math.round(v*100)+'%';
 return `<div class="filters sec"><label>Purchase group<select id="xfg">${['All','Equipment','Material'].map(g=>`<option ${f.grp===g?'selected':''}>${g}</option>`).join('')}</select></label>
 <label>Destination (ship-to)<select id="xfd"><option value="">All destinations</option>${dests.map(d=>`<option ${f.dest===d?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
 <label>Origin region<select id="xfr"><option value="">All regions</option>${['APAC','EMEA','North America'].map(r=>`<option ${f.reg===r?'selected':''}>${r}</option>`).join('')}</select></label>
 <button class="btn" data-act="execCopy" style="align-self:end">Copy exec summary</button></div>
 <div class="kpis sec">

 <div class="kpi"><span>Savings vs highest quote</span><b>${usd(x.save)}</b><em class="small">${x.hi?(x.save/x.hi*100).toFixed(1):0}% saved through competitive RFQ</em></div>
 <div class="kpi"><span>Cost per chargeable kg</span><b>${x.chg?'$'+(x.spend/x.chg).toFixed(2):'—'}</b><em class="small">${Math.round(x.chg).toLocaleString('en-US')} kg awarded</em></div>

 <div class="card"><h3>Pipeline — where POs are now</h3><p class="small">${F.length} POs in scope</p><div class="bars">${pipe.map(x=>`<div class="brow" title="${x.k}: ${x.v} PO(s)"><span class="bl">${x.k}</span><span class="bt"><i style="width:${x.v?Math.max(2,x.v/pmx*100):0}%"></i></span><span class="bv"><b>${x.v}</b></span></div>`).join('')}</div></div>

 <div class="card"><h3>Cycle time by stage</h3><p class="small">Average days · delivered and awarded POs</p><div class="bars">${cyc.map(([k,s2,v])=>`<div class="brow" title="${k}: ${f1(v)} days · ${s2}"><span class="bl" style="white-space:normal">${k}<em class="small" style="display:block;font-style:normal;white-space:normal">${s2}</em></span><span class="bt"><i style="width:${v?Math.max(2,v/cmx*100):0}%"></i></span><span class="bv"><b>${f1(v)} d</b></span></div>`).join('')}</div></div></div>

 ${(()=>{const geo=(fn)=>{const m=new Map();A.forEach(p=>{const k=fn(p);const o=m.get(k)||{k,sp:0,kg:0,n:0,tr:[],d:0,ot:0,reg:regionOf(p)};o.sp+=winQ(p).totalUsd;o.kg+=kg(p);o.n++;o.tr.push(winQ(p).transitDays);if(p.status==='delivered'&&p.shipment?.actualDelivery){o.d++;if(new Date(p.shipment.actualDelivery)<=new Date(p.shipment.eta))o.ot++}m.set(k,o)});return [...m.values()]};
  const R=geo(regionOf).sort((a,b)=>b.sp/Math.max(1,b.kg)-a.sp/Math.max(1,a.kg)),Cn=geo(countryOf).sort((a,b)=>b.sp/Math.max(1,b.kg)-a.sp/Math.max(1,a.kg)),rmx=Math.max(1,...R.map(o=>o.sp/Math.max(1,o.kg))),allKg=x.chg?x.spend/x.chg:0;

/* ---------- render ---------- */
function render(){
 if(ui.role!=='logistics'&&ui.as&&!me())ui.as='';
 $('#app').innerHTML=`<div class="app">${rail()}<div class="mainw">${topbar()}${ui.role==='logistics'?logistics():ui.role==='supplier'?supplierPortal():ffPortal()}</div></div>`;
 renderModal();refreshCalcs();saveUi()}
function renderModal(){
 let m='';if(ui.modal?.kind==='import')m=importModal();else if(ui.modal?.kind==='mail')m=mailModal();else if(ui.modal?.kind==='feed')m=feedModal(ui.modal.n);else if(ui.modal?.kind==='pickff')m=pickModal();else if(ui.modal?.kind==='issue')m=issueModal(ui.modal.cat);else if(ui.modal?.kind==='po'){const p=po(ui.modal.id);if(p)m=poModal(p);else ui.modal=null}
 if(ui.preview)m+=previewModal();
 $('#modal').innerHTML=m;document.body.style.overflow=m?'hidden':''}
function refreshCalcs(){
 document.querySelectorAll('form[data-form=pack]').forEach(f=>{const g=n=>f.elements[n]?.value;const p={units:g('units'),uL:g('uL'),uW:g('uW'),uH:g('uH'),mL:g('mL'),mW:g('mW'),mH:g('mH')};
  f.querySelector('[data-out=crates]').textContent=String(num(g('units'))*num(g('cratesPerUnit')));f.querySelector('[data-out=cbm]').textContent=cbmOf(p)+' m³'});
 document.querySelectorAll('form[data-form=quote]').forEach(f=>{f.querySelector('[data-out=total]').textContent=usd(num(f.elements.baseUsd.value)+num(f.elements.surchargeUsd.value))})}

/* ---------- actions ---------- */
function touch(p){p.updatedAt=nowIso()}
function openIssue(n){
 const c=db.catalog.find(x=>x.poNumber===n);
 if(!c){toast(`PO ${n} isn't in the SAP PO Catalog. Add it on the SAP PO Sync tab or load sample data (try 4500012101).`);return}
 const ex=db.pos.find(p=>p.poNumber===n);if(ex){ui.modal={kind:'po',id:ex.id};ui.mtab='specs';renderModal();toast(`PO ${n} is already issued — opened it.`);return}
 ui.modal={kind:'issue',cat:c};renderModal()}
function award(p,qid){
 if(p.nfa&&p.nfa.status!=='approved'){toast('Approve the NFA first.');return}
 const w=p.quotes.find(q=>q.id===qid);if(!w)return;p.awardedAt=nowIso();
 p.quotes.forEach(q=>q.status=q.id===qid?'awarded':'not_selected');
 p.awardedForwarderEmail=low(w.ffEmail);p.awardedForwarderCompany=w.ffCompany;
 p.aribaPoRef=`ARIBA-PO-${day(0).replace(/-/g,'')}-${String(Math.floor(1000+Math.random()*9000))}`;p.aribaSyncStatus='requested';
 p.status='ff_awarded';p.shipment={awb:'',carrier:w.carrier,pickupTime:'',pickupLocation:'',originPort:p.originPort,destinationPort:p.destinationPort,etd:'',eta:'',actualDelivery:'',milestone:'awaiting_pickup',note:''};touch(p);
 notify('logistics','Ariba PO requested',`${w.ffCompany} awarded for PO ${p.poNumber} at ${usd(w.totalUsd)}. Ref ${p.aribaPoRef}.`,p.id);
 notify(w.ffEmail,'You have been awarded',`PO ${p.poNumber} awarded at ${usd(w.totalUsd)}. Please add the AWB and pickup schedule.`,p.id);
 p.quotes.filter(q=>q.id!==qid).forEach(q=>notify(q.ffEmail,'RFQ closed',`PO ${p.poNumber} was awarded to another forwarder. Thank you for quoting.`,p.id));
 notify(p.supplierEmail,'Forwarder assigned',`${w.ffCompany} will collect PO ${p.poNumber}.`,p.id);
 save();render();toast(`Awarded to ${w.ffCompany}. Ariba reference ${p.aribaPoRef} queued (Ariba not connected in this build).`)}
function dispatchRfq(p,emails){
 p.invitedForwarderEmails=[...new Set(emails.map(low))];p.status='rfq_open';touch(p);
 p.invitedForwarderEmails.forEach(e=>notify(e,'New RFQ open',`PO ${p.poNumber} — ${p.packing?`${p.packing.units} ${p.packing.mode}, ${p.packing.grossKg} kg, ${p.packing.cbm} CBM`:''} ${p.originPort} → ${p.destinationPort}. Please quote.`,p.id))}
function parseCsv(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
function importCsv(text){
 const rows=parseCsv(text);if(rows.length<2){toast('CSV needs a header row and at least one data row.');return}
 const hd=rows[0].map(x=>x.trim());const need=['poNumber','supplierName','supplierEmail'];const miss=need.filter(n=>!hd.includes(n));if(miss.length){toast('CSV is missing column(s): '+miss.join(', '));return}
 let add=0,lines=0,bad=0;
 rows.slice(1).forEach(r=>{const o={};hd.forEach((k,i)=>o[k]=(r[i]||'').trim());if(!o.poNumber||!o.supplierEmail){bad++;return}
  let c=db.catalog.find(x=>x.poNumber===o.poNumber);
  if(!c){c={id:o.poNumber,poNumber:o.poNumber,pgCode:PG[o.pgCode]?o.pgCode:'',mgName:o.materialGroup||'',poDate:o.poDate||loc(new Date()),purchaseGroup:o.purchaseGroup==='Material'||/^M/.test(o.pgCode||'')?'Material':'Equipment',description:o.description||'',supplierName:o.supplierName,supplierEmail:low(o.supplierEmail),vendorCode:o.vendorCode||'',plant:o.plant||'',originPort:o.originPort||'',destinationPort:o.destinationPort||'',incoterms:o.incoterms||'',deliveryDate:o.deliveryDate||'',items:[],source:'csv'};db.catalog.push(c);add++}
  if(o.material||o.quantity){c.items.push({line:(c.items.length+1)*10,material:o.material||'',desc:o.description||'',qty:num(o.quantity),unit:o.unit||'EA'});lines++}});
 ui.modal=null;ui.tab='pos';ui.pf={pg:'',mg:'',sup:'',dest:'',q:'',st:'new'};ui.psel=[];save();render();toast(`Added ${add} PO(s) and ${lines} line item(s) to the list${bad?`, skipped ${bad} incomplete row(s)`:''}. They show under Not requested.`)}

 csv:async f=>{const file=$('#csvFile').files[0];let t=$('#csvText').value;if(file){if(file.size>2e6){toast('CSV is over 2 MB.');return}t=await file.text()}if(!t.trim()){toast('Choose a CSV file or paste CSV first.');return}importCsv(t)},
 catAdd:f=>{const d=Object.fromEntries(new FormData(f));if(feedRows().some(c=>c.poNumber===d.poNumber)){toast('That PO number is already in the list.');return}
  const g=/^M/.test(d.pgCode)?'Material':'Equipment';
  db.catalog.push({id:d.poNumber,poNumber:d.poNumber,pgCode:d.pgCode,mgName:d.mgName.trim(),poDate:d.poDate||loc(new Date()),purchaseGroup:g,description:d.description,supplierName:d.supplierName,supplierEmail:low(d.supplierEmail),vendorCode:d.vendorCode,plant:(SHIPTO[+d.shipTo]||SHIPTO[0])[0],originPort:d.originPort,destinationPort:(SHIPTO[+d.shipTo]||SHIPTO[0])[1],incoterms:d.incoterms,deliveryDate:d.deliveryDate,items:[{line:10,material:d.material||'',desc:d.description,qty:num(d.qty)||1,unit:d.unit||'EA'}],source:'manual'});
  ui.modal=null;ui.pf={pg:'',mg:'',sup:'',dest:'',q:'',st:'new'};ui.psel=[];save();render();toast(`PO ${d.poNumber} added — it's under Not requested, ready to email the supplier.`)},
 issue:f=>{const c=ui.modal.cat;const fd=new FormData(f);const email=low(fd.get('supplierEmail'));
  if(db.pos.some(p=>p.poNumber===c.poNumber)){toast('Already issued.');return}
  const p={...c,id:'PO-'+c.poNumber,supplierEmail:email,status:'po_issued',requestNote:String(fd.get('note')||'').slice(0,1000),autoDispatchRfq:fd.get('auto')==='on',invitedForwarderEmails:fd.getAll('ff').map(low),awardedForwarderEmail:'',awardedForwarderCompany:'',aribaPoRef:'',aribaSyncStatus:'',packing:null,documents:[],quotes:[],shipment:null,tracking:[],createdAt:nowIso(),updatedAt:nowIso()};
  delete p.source;db.pos.push(p);
  if(!db.stakeholders.some(s=>low(s.email)===email))db.stakeholders.push({id:c.vendorCode||uid('V'),type:'supplier',vendorCode:c.vendorCode,companyName:c.supplierName,contactName:'',email,purchaseGroup:c.purchaseGroup,city:''});
  notify(email,'Packing details requested',`PO ${p.poNumber}: ${p.requestNote}`,p.id);notify('logistics','PO issued to supplier',`PO ${p.poNumber} sent to ${p.supplierName}.`,p.id);
  save();ui.modal=null;ui.tab='pos';render();toast(`PO ${p.poNumber} issued. ${p.supplierName} can now fill packing details in the Supplier Portal.`)},
 note:f=>{const p=po(f.elements.id.value);p.requestNote=f.elements.note.value.slice(0,1000);touch(p);notify(p.supplierEmail,'Updated request from Logistics Center',`PO ${p.poNumber}: ${p.requestNote}`,p.id);save();render();toast('Request note saved and resent to the supplier.')},
 ffSave:f=>{const d=Object.fromEntries(new FormData(f));d.serviceModes=new FormData(f).getAll('mode');delete d.mode;d.email=low(d.email);
  const dup=db.stakeholders.find(s=>low(s.email)===d.email&&s.id!==ui.editId);if(dup){toast('Another partner already uses that email.');return}
  if(ui.editId){Object.assign(db.stakeholders.find(s=>s.id===ui.editId),d)}else{if(db.stakeholders.some(s=>s.id===d.ffCode)){toast('That FF code exists.');return}db.stakeholders.push({id:d.ffCode,type:'ff',...d})}
  ui.editId=null;ui.editType=null;save();render();toast('Forwarder saved.')},
 supSave:f=>{const d=Object.fromEntries(new FormData(f));d.email=low(d.email);
  const dup=db.stakeholders.find(s=>low(s.email)===d.email&&s.id!==ui.editId);if(dup){toast('Another partner already uses that email.');return}
  if(ui.editId){Object.assign(db.stakeholders.find(s=>s.id===ui.editId),d)}else{if(db.stakeholders.some(s=>s.id===d.vendorCode)){toast('That vendor code exists.');return}db.stakeholders.push({id:d.vendorCode,type:'supplier',...d})}
  ui.editId=null;ui.editType=null;save();render();toast('Supplier saved.')},
 pack:f=>{const p=po(f.dataset.id);if(!p)return;const d=Object.fromEntries(new FormData(f));
  const miss=MUST.filter(t=>!p.documents.some(x=>x.type===t));if(miss.length){toast('Upload required document(s) first: '+miss.join(', '));return}
  if(num(d.grossKg)<num(d.netKg)){toast('Gross weight must be at least the net weight.');return}
  const k={coo:(d.coo||'').trim().slice(0,60),originPort:(d.originPort||'').trim().slice(0,60),destPort:(d.destPort||'').trim().slice(0,60),mode:d.mode==='cartons'?'cartons':'boxes',qtyAsPerPo:num(d.qtyAsPerPo),units:num(d.units),cratesPerUnit:num(d.cratesPerUnit),mL:num(d.mL),mW:num(d.mW),mH:num(d.mH),uL:num(d.uL),uW:num(d.uW),uH:num(d.uH),netKg:num(d.netKg),grossKg:num(d.grossKg),perCountKg:num(d.perCountKg),pickupReadyDate:d.pickupReadyDate,remarks:(d.remarks||'').slice(0,500),submittedAt:nowIso()};
  k.totalCrates=k.units*k.cratesPerUnit;k.cbm=cbmOf(k);p.packing=k;touch(p);
  notify('logistics','Supplier submitted packing & documents',`${p.supplierName} submitted specs (${k.units} ${k.mode}, ${k.grossKg} kg, ${k.cbm} CBM) and ${p.documents.length} document(s) for PO ${p.poNumber}.`,p.id);
  if(p.autoDispatchRfq&&p.invitedForwarderEmails.length&&p.status==='po_issued'){dispatchRfq(p,p.invitedForwarderEmails);toast('Submitted. RFQ sent automatically to the invited forwarders.')}
  else{p.status='docs_submitted';toast(missingDocs(p).length?`Submitted. Still missing: ${missingDocs(p).join(', ')} — this PO stays in Action needed until uploaded.`:'Submitted. The PO moved to your Submitted tab.')}
  ui.openPo='';save();render()},
 quote:f=>{const p=po(f.dataset.id);const m=me();if(!p||!m)return;if(p.status!=='rfq_open'){toast('This RFQ is closed.');return}
  const d=Object.fromEntries(new FormData(f));const e=low(m.email);let q=p.quotes.find(x=>low(x.ffEmail)===e);const isNew=!q;
  if(!q){q={id:`Q-${p.poNumber}-${m.id}`,ffEmail:e,ffCompany:m.companyName,status:'submitted'};p.quotes.push(q)}
  Object.assign(q,{baseUsd:num(d.baseUsd),surchargeUsd:num(d.surchargeUsd),totalUsd:num(d.baseUsd)+num(d.surchargeUsd),transitDays:Math.round(num(d.transitDays)),carrier:d.carrier.slice(0,60),route:d.route.slice(0,100),validUntil:d.validUntil,remarks:(d.remarks||'').slice(0,500),at:nowIso()});touch(p);
  notify('logistics',isNew?'New RFQ quote received':'RFQ quote revised',`${m.companyName} quoted ${usd(q.totalUsd)} / ${q.transitDays} days for PO ${p.poNumber}.`,p.id);
  save();render();toast(isNew?'Quote submitted.':'Quote updated.')},
 ship:f=>{const p=po(f.dataset.id);if(!p)return;if(p.status==='delivered'){toast('Delivered shipments are locked.');return}
  const d=Object.fromEntries(new FormData(f));const c=awbCheck(d.awb);if(!c.ok){toast('Fix the AWB number first: '+c.msg);return}
  if(d.milestone==='delivered'&&!d.actualDelivery){toast('Add the actual delivery time before marking Delivered.');return}
  const prev=p.shipment?.milestone;p.shipment={...d,awb:c.awb};delete p.shipment.note;p.shipment.note=d.note||p.shipment?.note||'';
  if(prev!==d.milestone||d.note)p.tracking.push({id:uid('T'),milestone:d.milestone,note:d.note||MILE[d.milestone],at:loc(new Date()),by:p.awardedForwarderCompany});
  p.status=d.milestone==='delivered'?'delivered':['awaiting_pickup'].includes(d.milestone)?'ff_awarded':'in_transit';touch(p);
  const msg=`PO ${p.poNumber} · AWB ${c.awb}: ${MILE[d.milestone]}${d.note?' — '+d.note:''}`;
  notify('logistics',d.milestone==='delivered'?'Shipment delivered':'Shipment update',msg,p.id);notify(p.supplierEmail,d.milestone==='delivered'?'Shipment delivered':'Shipment update',msg,p.id);
  save();render();toast(d.milestone==='delivered'?'Marked delivered. Logistics Center and supplier notified; shipment locked.':'Update saved and stakeholders notified.')}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')e.preventDefault();const a=ACT[b.dataset.act];if(a){if(b.dataset.act!=='closeBg'&&b.dataset.act!=='closePrev')e.stopPropagation();a(b,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fn=FORM[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='search'){ui.q=t.value;$('#poList').innerHTML=poTable();return}
 if(t.name==='supplierName'&&t.form?.dataset.form==='catAdd'){const x=sups().find(v=>v.companyName===t.value);if(x){t.form.elements.supplierEmail.value=x.email;t.form.elements.vendorCode.value=x.vendorCode||''}}
 if(t.id==='pfq'){ui.pf.q=t.value;refreshPos();return}
 if(t.id==='qfq'){ui.qf.q=t.value;const pos=t.selectionStart;render();const n=$('#qfq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(t.id==='mSubj'||t.id==='mBody'){ui.mailT[t.id==='mSubj'?'subject':'body']=t.value;const r=feedRows().find(x=>x.poNumber===ui.modal.nums[0]);$('#mPrev').innerHTML=mailPrev(r);return}
 if(t.id==='pickQ'){ui.pickQ=t.value;const pos=t.selectionStart;renderModal();const n=$('#pickQ');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(t.dataset.pick!==undefined){ui.pick=t.checked?[...new Set([...ui.pick,t.value])]:ui.pick.filter(x=>x!==t.value);refreshPick();return}
 if(t.id==='rq'){ui.rf.q=t.value;refreshResp();return}
 if(t.dataset.calc!==undefined)refreshCalcs();
 if(t.dataset.awb!==undefined){const c=awbCheck(t.value);const o=t.parentElement.querySelector('[data-out=awb]');o.textContent=c.msg;o.className='awbres '+(c.ok?'ok':c.empty?'small':'bad');const car=t.form.elements.carrier;if(c.ok&&c.airline&&!car.value)car.value=c.airline}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='who'){const v=t.value;if(v==='logistics'){ui.role='logistics';ui.as=''}else{const i=v.indexOf(':');ui.role=v.slice(0,i);ui.as=v.slice(i+1)}ui.modal=null;ui.preview=null;ui.openPo=null;ui.stab='need';ui.ftab='quote';render();window.scrollTo(0,0);return}
 if(['xfg','xfd','xfr'].includes(t.id)){ui.xf[{xfg:'grp',xfd:'dest',xfr:'reg'}[t.id]]=t.value;render();return}
 if(t.id==='pfpg'){ui.pf.pg=t.value;ui.pf.mg='';ui.psel=[];render();return}
 if(t.id==='pfmg'||t.id==='pfsup'||t.id==='pfdest'){ui.pf[{pfmg:'mg',pfsup:'sup',pfdest:'dest'}[t.id]]=t.value;ui.psel=[];refreshPos();return}
 if(['rsup','rgrp','rdocs'].includes(t.id)){ui.rf[{rsup:'sup',rgrp:'grp',rdocs:'docs',rst:'st'}[t.id]]=t.value;ui.rsel=[];refreshResp();return}
 if(t.id==='group'){ui.group=t.value;$('#poList').innerHTML=poTable();return}
 if(t.dataset.upload){const file=t.files[0];if(!file)return;if(file.size>MAXFILE){toast(`${file.name} is ${(file.size/1024).toFixed(0)} KB — the limit is ${MAXFILE/1024} KB.`);t.value='';return}
  const p=po(t.dataset.id);const r=new FileReader();r.onload=()=>{p.documents.push({id:uid('D'),type:t.dataset.upload,name:file.name.slice(0,120),mime:file.type||'application/octet-stream',size:file.size,dataUrl:r.result,uploadedBy:t.dataset.ff?'forwarder':'supplier',by:me()?.companyName||'',at:nowIso()});touch(p);
   if(t.dataset.ff)notify('logistics',`${t.dataset.upload} uploaded`,`${me()?.companyName||'Forwarder'} uploaded ${t.dataset.upload} for PO ${p.poNumber}.`,p.id);
   const keep=t.form?Object.fromEntries(new FormData(t.form)):null;save();render();
   if(keep){const f=document.querySelector(`form[data-id="${CSS.escape(p.id)}"]`);if(f)for(const[k,v]of Object.entries(keep)){const el=f.elements[k];if(!el||el.type==='file')continue;if(el instanceof RadioNodeList){[...el].forEach(x=>x.checked=x.value===v)}else el.value=v}refreshCalcs()}
   toast(`${file.name} uploaded.`)};r.readAsDataURL(file)}});
if((!db.pos.length&&!db.stakeholders.length&&!db.catalog.length)||db.ver!==15){db=blank();seed(true);db.ver=15;save()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.preview){ui.preview=null;renderModal()}else if(ui.modal){ui.modal=null;renderModal()}}});
render();
}
</script>
